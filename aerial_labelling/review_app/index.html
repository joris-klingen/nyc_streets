<title>Lane Date Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: project rail on the left, one project's evidence and form on the right; stacks on phones.
     Magenta is the colour of the street line drawn on the aerial sheets, so it is the accent. */
  :root {
    --bg: #f3f5f4;
    --surface: #ffffff;
    --fg: #17201d;
    --muted: #5d6a65;
    --line: #d7deda;
    --accent: #b5179e;
    --accent-soft: #f6e3f2;
    --ok: #1f7a4d;
    --ok-soft: #e1f2e8;
    --warn: #a15c00;
    --p1: #b42318;
    --p2: #2f5fa7;
    --p3: #6b7570;
    --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121816; --surface: #1a2220; --fg: #e5ebe8; --muted: #9aa7a2; --line: #2c3633;
      --accent: #e45fcd; --accent-soft: #3a1f35; --ok: #5cc28d; --ok-soft: #173326; --warn: #e0a24a;
      --p1: #f0857a; --p2: #8fb0e6; --p3: #9aa7a2; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121816; --surface: #1a2220; --fg: #e5ebe8; --muted: #9aa7a2; --line: #2c3633;
    --accent: #e45fcd; --accent-soft: #3a1f35; --ok: #5cc28d; --ok-soft: #173326; --warn: #e0a24a;
    --p1: #f0857a; --p2: #8fb0e6; --p3: #9aa7a2; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body); }
  .wrap { max-width: 1280px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
  header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; border-bottom: 2px solid var(--fg); padding-bottom: 10px; }
  h1 { font: 700 2rem/1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; margin: 0; }
  .sub { color: var(--muted); margin: 4px 0 0; max-width: 70ch; }
  .progress { font: 500 .95rem var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 6px; overflow: hidden; min-width: 180px; }
  .bar > i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .3s; }
  .status-line { margin: 10px 0 0; color: var(--muted); font-size: .9rem; min-height: 1.4em; }
  .status-line.warn { color: var(--warn); }

  .layout { display: grid; grid-template-columns: minmax(250px, 300px) minmax(0, 1fr); gap: 20px; margin-top: 16px; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: minmax(0, 1fr); } .rail { max-height: 280px; } }

  .rail { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; position: sticky; top: env(safe-area-inset-top, 0px); max-height: calc(100vh - 32px); overflow: auto; }
  .filters { display: flex; gap: 4px; padding: 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 1; }
  .filters button { flex: 1; font: 600 .8rem var(--font-body); letter-spacing: .04em; text-transform: uppercase; padding: 6px 4px; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 4px; cursor: pointer; }
  .filters button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .group { font: 600 .72rem var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 10px 12px 4px; }
  .rail ol { list-style: none; margin: 0; padding: 0 0 6px; }
  .rail li button { width: 100%; text-align: left; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 12px; border: 0; border-left: 3px solid transparent; background: transparent; color: var(--fg); font: inherit; cursor: pointer; }
  .rail li button:hover { background: var(--bg); }
  .rail li button[aria-current="true"] { border-left-color: var(--accent); background: var(--accent-soft); }
  .pid { font: 500 .8rem var(--font-mono); color: var(--muted); }
  .sname { font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); }
  .dot.done { background: var(--ok); border-color: var(--ok); }

  .detail { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px 20px; min-width: 0; }
  .eyebrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { font: 600 .72rem var(--font-body); letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 3px; border: 1px solid currentColor; }
  .chip.p1 { color: var(--p1); } .chip.p2 { color: var(--p2); } .chip.p3 { color: var(--p3); }
  .chip.cat { color: var(--muted); }
  .chip.done { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
  h2 { font: 700 2.2rem/1.05 var(--font-display); text-transform: uppercase; letter-spacing: .01em; margin: 8px 0 2px; text-wrap: balance; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 20px; margin: 14px 0; }
  .fact dt { font: 600 .72rem var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .fact dd { margin: 2px 0 0; font: 500 1rem var(--font-mono); font-variant-numeric: tabular-nums; }
  .task { background: var(--accent-soft); border-left: 3px solid var(--accent); padding: 10px 14px; border-radius: 0 4px 4px 0; margin: 0 0 14px; max-width: 75ch; }
  .note { color: var(--muted); font-size: .9rem; margin: 0 0 14px; max-width: 75ch; }
  .views { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
  .views a { font: 600 .9rem var(--font-body); color: var(--accent); border: 1px solid var(--accent); padding: 7px 12px; border-radius: 4px; text-decoration: none; }
  .views a:hover, .views a:focus-visible { background: var(--accent); color: var(--surface); }
  .hint { font-size: .85rem; color: var(--muted); margin: -8px 0 16px; }
  figure { margin: 0 0 18px; }
  figure img { display: block; width: 100%; height: auto; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); }
  figcaption { font-size: .82rem; color: var(--muted); margin-top: 4px; }

  form { border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 14px; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px 20px; }
  label, legend { font: 600 .78rem var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  fieldset { border: 0; padding: 0; margin: 0; }
  input[type="month"], select, textarea { width: 100%; margin-top: 4px; font: 500 .95rem var(--font-body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; }
  textarea { min-height: 70px; resize: vertical; font-family: var(--font-body); }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .seg label { text-transform: none; letter-spacing: 0; font: 500 .9rem var(--font-body); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
  .seg input { accent-color: var(--accent); }
  .check { display: flex; gap: 8px; align-items: center; text-transform: none; letter-spacing: 0; font: 500 .9rem var(--font-body); color: var(--fg); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .btn { font: 600 .95rem var(--font-body); padding: 9px 18px; border-radius: 4px; border: 1px solid var(--fg); background: var(--fg); color: var(--bg); cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--fg); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .saved { font-size: .88rem; color: var(--muted); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Lane Date Review</h1>
      <p class="sub">Manhattan protected bike lane projects where the aerial photos disagree with the DOT or pipeline date. For each project, step back through Street View's dates and record when physical protection first appears.</p>
    </div>
    <div>
      <div class="progress" id="progress">0 of 0 checked</div>
      <div class="bar"><i id="bar"></i></div>
    </div>
  </header>
  <p class="status-line" id="status">Connecting to the shared answers…</p>

  <div class="layout">
    <nav class="rail" aria-label="Projects">
      <div class="filters" role="group" aria-label="Show">
        <button type="button" data-filter="todo" aria-pressed="true">To do</button>
        <button type="button" data-filter="done" aria-pressed="false">Done</button>
        <button type="button" data-filter="all" aria-pressed="false">All</button>
      </div>
      <div id="list"></div>
    </nav>

    <main class="detail" id="detail" aria-live="polite"></main>
  </div>
</div>

: "3", "category": "park_drive_definition", "proj_id": "M092", "street": "CPW 85 APPROACH", "n_segments": "2", "prot_pipe": "2018-06-27", "prot_dot": "2018-06-27", "aerial_window": "before Jun 2008, by 02 May 2018", "note": "park drive curve with separate path; trees early years", "streetview_1": "https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=40.783865,-73.969145&heading=138&pitch=-10&fov=90", "streetview_2": "https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=40.784330,-73.969500&heading=138&pitch=-10&fov=90", "streetview_3": ""}, {"priority": "3", "category": "park_drive_definition", "proj_id": "M122", "street": "WEST DRIVE", "n_segments": "2", "prot_pipe": "2012-07-09", "prot_dot": "2018-06-27", "aerial_window": "before Jun 2008, by 01 Jun 2014", "note": "park drive; plain two-lane road to 2012; buffered bike lane from 2014", "streetview_1": "https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=40.775345,-73.975475&heading=178&pitch=-10&fov=90", "streetview_2": "https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=40.775895,-73.975530&heading=178&pitch=-10&fov=90", "streetview_3": ""}]</script>
<script>
(function () {
  const PROJECTS = JSON.parse(document.getElementById("projects").textContent);
  const CATS = {
    claim_too_early: { label: "Claimed too early", task: "The aerial photos show no lane after the claimed date. Check whether physical protection existed at the claimed date. Parking-protected lanes without green paint are easy to miss from the air, so look at the curb lane closely." },
    claim_too_late: { label: "Claimed too late", task: "A buffered or protected lane is visible in the photos before the claimed date. Find the first panorama with physical protection, and record what was there before (often a painted buffered lane)." },
    park_drive_definition: { label: "Park drive", task: "Decision taken: park drives count as protected from the date the drive became fully car-free. Confirm that date for this section and record it as the protection date." }
  };
  const BEFORE = [["none", "No bike lane"], ["conventional", "Conventional lane"], ["buffered", "Painted buffer"], ["protected", "Already protected"]];
  const CONF = [["high", "High"], ["medium", "Medium"], ["low", "Low"]];

  let reviews = {};          // proj_id -> review document body
  let current = PROJECTS[0] ? PROJECTS[0].proj_id : null;
  let filter = "todo";
  let db = null, user = null, myId = null, canWrite = true, names = {};

  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else if (v !== null && v !== undefined) n.setAttribute(k, v);
    }
    for (const k of kids) if (k) n.append(k);
    return n;
  };
  const isDone = id => !!reviews[id];
  const fmtDate = d => d ? d : "–";

  function setStatus(msg, warn) { const s = $("#status"); s.textContent = msg; s.classList.toggle("warn", !!warn); }

  function renderProgress() {
    const n = PROJECTS.filter(p => isDone(p.proj_id)).length;
    $("#progress").textContent = n + " of " + PROJECTS.length + " checked";
    $("#bar").style.width = (PROJECTS.length ? 100 * n / PROJECTS.length : 0) + "%";
  }

  function renderList() {
    const box = $("#list"); box.replaceChildren();
    const groups = [[1, "Priority 1 · large projects"], [2, "Priority 2"], [3, "Park drives"]];
    for (const [pr, title] of groups) {
      const items = PROJECTS.filter(p => +p.priority === pr && (filter === "all" || (filter === "done") === isDone(p.proj_id)));
      if (!items.length) continue;
      box.append(el("div", { class: "group", text: title }));
      const ol = el("ol");
      for (const p of items) {
        const b = el("button", { type: "button", "aria-current": p.proj_id === current ? "true" : "false" },
          el("span", { class: "dot" + (isDone(p.proj_id) ? " done" : ""), "aria-hidden": "true" }),
          el("span", { class: "sname", text: titleCase(p.street) }),
          el("span", { class: "pid", text: p.proj_id }));
        b.addEventListener("click", () => { current = p.proj_id; renderList(); renderDetail(); window.scrollTo({ top: 0 }); });
        ol.append(el("li", {}, b));
      }
      box.append(ol);
    }
    if (!box.children.length) box.append(el("p", { class: "group", text: filter === "done" ? "Nothing checked yet." : "All projects checked." }));
  }

  function titleCase(s) { return s.toLowerCase().replace(/\b([a-z])/g, m => m.toUpperCase()).replace(/\b(\d+) (Av|Avenue)\b/i, "$1 Av"); }

  function renderDetail() {
    const box = $("#detail"); box.replaceChildren();
    const p = PROJECTS.find(x => x.proj_id === current);
    if (!p) { box.append(el("p", { text: "Pick a project on the left." })); return; }
    const cat = CATS[p.category] || { label: p.category, task: "" };
    const r = reviews[p.proj_id];

    box.append(el("div", { class: "eyebrow" },
      el("span", { class: "chip p" + p.priority, text: "Priority " + p.priority }),
      el("span", { class: "chip cat", text: cat.label }),
      r ? el("span", { class: "chip done", text: "Checked" }) : null,
      el("span", { class: "pid", text: p.proj_id })));
    box.append(el("h2", { text: titleCase(p.street) }));

    const facts = el("dl", { class: "facts" });
    for (const [k, v] of [["Segments", p.n_segments], ["Pipeline date", fmtDate(p.prot_pipe)], ["DOT 2026 date", fmtDate(p.prot_dot)], ["Protection appeared (aerial)", p.aerial_window || "no protection seen"]]) {
      facts.append(el("div", { class: "fact" }, el("dt", { text: k }), el("dd", { text: String(v) })));
    }
    box.append(facts);
    box.append(el("p", { class: "task", text: cat.task }));
    if (p.note) box.append(el("p", { class: "note", text: "Aerial note: " + p.note }));

    const views = el("div", { class: "views" });
    ["streetview_1", "streetview_2", "streetview_3"].forEach((k, i) => {
      if (p[k]) views.append(el("a", { href: p[k], target: "_blank", rel: "noopener", text: "Street View " + (i + 1) + " ↗" }));
    });
    box.append(views);
    box.append(el("p", { class: "hint", text: "Three points spread along the project, looking along the street. In Street View, open \"See more dates\" (top left) to step back in time." }));

    box.append(el("figure", {},
      el("img", { src: "sheets/" + p.proj_id + ".jpg", alt: "Aerial photos 2008 to 2024 of " + titleCase(p.street) + ", with the project's street segments marked in magenta", loading: "lazy" }),
      el("figcaption", { text: "Aerial photos 2008–2024, each labelled with its Manhattan capture date (NYC OTI). 2008–2014 were flown in June with trees in leaf; 2016 onward in March–April. 70 m square, street running vertically; magenta marks the project segments. A photo can date a change more precisely than Street View when it falls between two panoramas." })));

    box.append(buildForm(p, r));
  }

  function buildForm(p, r) {
    const f = el("form", { id: "review-form", novalidate: "" });
    const row1 = el("div", { class: "row" });
    const monthWrap = el("div", {},
      el("label", { for: "f-month", text: "Protection first visible" }),
      el("input", { type: "month", id: "f-month", min: "1990-01", max: "2026-12", value: r ? (r.protected_from || "") : "" }));
    const none = el("label", { class: "check" }, el("input", { type: "checkbox", id: "f-none" }), document.createTextNode("No physical protection found"));
    if (r && r.protected_from === "none") { none.firstChild.checked = true; monthWrap.querySelector("input").value = ""; }
    monthWrap.append(none);
    row1.append(monthWrap);

    const sel = el("select", { id: "f-before" });
    sel.append(el("option", { value: "", text: "Choose…" }));
    for (const [v, t] of BEFORE) { const o = el("option", { value: v, text: t }); if (r && r.before_type === v) o.selected = true; sel.append(o); }
    row1.append(el("div", {}, el("label", { for: "f-before", text: "What was there before" }), sel));
    f.append(row1);

    const fs = el("fieldset", {}, el("legend", { text: "Confidence" }));
    const seg = el("div", { class: "seg" });
    for (const [v, t] of CONF) {
      const inp = el("input", { type: "radio", name: "conf", id: "f-conf-" + v, value: v });
      if (r && r.confidence === v) inp.checked = true;
      seg.append(el("label", { for: "f-conf-" + v }, inp, document.createTextNode(t)));
    }
    fs.append(seg); f.append(fs);

    const ta = el("textarea", { id: "f-note", placeholder: "What you saw: panorama dates before and after, cross streets, anything unusual" });
    ta.value = r ? (r.note || "") : "";
    f.append(el("div", {}, el("label", { for: "f-note", text: "Note" }), ta));

    const save = el("button", { type: "submit", class: "btn", text: r ? "Update answer" : "Save answer" });
    const next = el("button", { type: "button", class: "btn ghost", text: "Next project" });
    const saved = el("span", { class: "saved", id: "saved-line" });
    if (r) {
      saved.textContent = "Saved " + new Date(r.saved_at).toLocaleString() + (r.by ? " by " + (names[r.by] || "a reviewer") : "");
    }
    if (!db || !canWrite) { save.disabled = true; saved.textContent = !db ? "Answers can't be saved in this view. Open the page on claude.ai while signed in." : "You can view the answers but not change them."; }
    f.append(el("div", { class: "actions" }, save, next, saved));

    next.addEventListener("click", () => {
      const order = PROJECTS.filter(x => !isDone(x.proj_id) && x.proj_id !== current);
      if (order.length) { current = order[0].proj_id; renderList(); renderDetail(); window.scrollTo({ top: 0 }); }
    });
    f.addEventListener("submit", async ev => {
      ev.preventDefault();
      const noneOn = $("#f-none").checked;
      const month = $("#f-month").value;
      const conf = (f.querySelector('input[name="conf"]:checked') || {}).value || "";
      if (!noneOn && !/^\d{4}-\d{2}$/.test(month)) { saved.textContent = "Enter the month protection first appears, or tick \"No physical protection found\"."; return; }
      if (!conf) { saved.textContent = "Choose a confidence level."; return; }
      const body = {
        proj_id: p.proj_id, street: p.street,
        protected_from: noneOn ? "none" : month,
        before_type: $("#f-before").value,
        confidence: conf,
        note: $("#f-note").value.trim().slice(0, 2000),
        by: myId || "",
        saved_at: new Date().toISOString()
      };
      save.disabled = true; saved.textContent = "Saving…";
      try {
        await db.collection("reviews").doc(p.proj_id).set(body);
        saved.textContent = "Saved.";
      } catch (e) {
        if (e && e.code === "invalid_argument") { canWrite = false; saved.textContent = "Your access level doesn't allow saving answers."; }
        else if (e && e.code === "unavailable") { saved.textContent = "The connection dropped. Try saving again."; save.disabled = false; }
        else { saved.textContent = "Couldn't save (" + ((e && e.code) || "error") + ")."; save.disabled = false; }
      }
    });
    return f;
  }

  document.querySelectorAll(".filters button").forEach(b => b.addEventListener("click", () => {
    filter = b.dataset.filter;
    document.querySelectorAll(".filters button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    renderList();
  }));

  renderProgress(); renderList(); renderDetail();

  async function resolveNames() {
    if (!user) return;
    const ids = [...new Set(Object.values(reviews).map(r => r.by).filter(Boolean))];
    if (!ids.length) return;
    try {
      const ps = await user.profiles(ids);
      for (const id of ids) names[id] = (ps[id] && ps[id].name) || "";
    } catch (e) { /* names stay blank */ }
  }

  (async () => {
    try {
      db = await claude.use("db");
      user = await claude.use("user");
    } catch (e) { db = null; }
    if (!db) { setStatus("Answers can't load in this view. Open the page on claude.ai while signed in to save answers.", true); renderDetail(); return; }
    if (user) {
      try { myId = await user.id(); } catch (e) { myId = null; }
      try { const c = await user.can("data.write"); if (c === false) canWrite = false; } catch (e) {}
    }
    setStatus(canWrite ? "Answers are shared: everyone with access sees the same progress." : "Read-only: you can see the answers but not change them.");
    db.collection("reviews").onSnapshot(async snap => {
      const next = {};
      for (const d of snap.docs) next[d.id] = d.data();
      reviews = next;
      await resolveNames();
      renderProgress(); renderList();
      const f = document.getElementById("review-form");
      const typing = f && f.contains(document.activeElement);
      if (!typing) renderDetail();
    }, e => setStatus("Lost the connection to the shared answers. Reload the page to reconnect.", true));
  })();
})();
</script>
